[package]
name = "musicai"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
ebur128 = "0.1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "wav", "pcm"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "net", "io-util", "io-std", "sync"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
